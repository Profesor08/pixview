ShortDescription: Lightweight image viewer in the spirit of Picasa Photo Viewer.
Description: |-
  PixView is a fast, lightweight image viewer for Windows 10 and 11 in the spirit of Picasa Photo Viewer: viewing only, no editing.
  It opens photos over a dimmed desktop, with a filmstrip, zoom and full screen mode.
  Supports JPG, PNG, GIF and APNG (animated), WebP, HEIC/HEIF, AVIF, JPEG XL, TIFF (multi-page), camera RAW, TGA, QOI, HDR, ICNS, EMF/WMF and more.
  A single exe with no dependencies; the UI is available in 13 languages.
